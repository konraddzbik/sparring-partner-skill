schema_version: "1.1"
name: leadership-reorg-irreversible
expected_outcome: |
  Challenges speed vs reversibility (hard-to-reverse people decision made fast and without the people affected), runs a premortem or names concrete failure modes (e.g., losing the other manager, span of control, morale), asks about the actual coordination problem/evidence, and leaves the decision with the VP. Tone is respectful.
